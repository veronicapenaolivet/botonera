# Cada push a main actualiza la carpeta de este repo en Hostinger.
name: Deploy a Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: 195.35.10.128
          port: 65002
          username: u786237644
          key: ${{ secrets.HOSTINGER_KEY }}
          script: |
            set -e
            D=~/domains/veronicapenaolivet.com/public_html/botonera
            R=git@github.com:veronicapenaolivet/botonera.git
            mkdir -p "$D" && cd "$D"
            # Si la carpeta todavía no es un repo, la convierte (sin borrar nada)
            if [ ! -d .git ]; then git init -q && git remote add origin "$R"; fi
            git remote set-url origin "$R"
            git fetch origin main
            git reset --hard origin/main
